name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "*.md"
    pull_request:
        paths-ignore:
            - "*.md"
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3"]
                symfony: ["^6.4", "^7.4"]
                # The skeleton also lists "~2.0.0": Composer now refuses every 2.0.x release, all
                # affected by published security advisories, so that line cannot build anywhere.
                sylius: ["~2.1.0", "~2.2.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                include:
                    # Test Application 2.1 (alpha) no longer builds its frontend: its stimulus-bridge
                    # cannot find webpack's LoaderDependency with today's npm packages. Not the
                    # plugin's doing: the 2.1 lines run without the JavaScript build.
                    - sylius: "~2.1.0"
                      e2e_js: "no"
                    - php: "8.3"
                      symfony: "^7.4"
                      sylius: "~2.2.0"
                      database: "mysql:8.0"
                      node: "22.x"
                    - php: "8.3"
                      symfony: "^7.4"
                      sylius: "~2.2.0"
                      database: "mariadb:10.11"
                      node: "22.x"
                    - php: "8.3"
                      symfony: "^7.4"
                      sylius: "~2.2.0"
                      database: "mariadb:11.4"
                      node: "22.x"
                    # The skeleton also runs PostgreSQL 15, 16 and 17: the plugin's migrations are raw
                    # MySQL (AUTO_INCREMENT, JSON_EXTRACT) and fail there — a finding of the audit, to fix
                    # in its own issue; until then the matrix stops at MySQL and MariaDB.

        env:
            APP_ENV: test
            ALMA_API_URL: http://127.0.0.1:8000

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    e2e_js: "${{ matrix.e2e_js || 'yes' }}"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                # Alma's backend, doubled by the mock server of tests/MockAlma, reached through ALMA_API_URL
                name: Start the Alma mock
                run: |
                    python3 -m pip install --quiet -r tests/MockAlma/requirements.txt
                    (cd tests/MockAlma && PUBLIC_URL=http://127.0.0.1:8000 nohup python3 -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/alma-mock.log 2>&1 &)
                    for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
                    curl -sf http://127.0.0.1:8000/ > /dev/null || (cat /tmp/alma-mock.log; exit 1)

            -
                name: Run Non-unit PHPUnit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit

            -
                # Behat in strict mode fails on "No scenarios": the step waits for the plugin's first
                # feature (cycle 2, second pull request).
                name: Run Behat
                if: hashFiles('features/**/*.feature') != ''
                run: vendor/bin/behat --colors --strict -vvv --no-interaction -f progress || vendor/bin/behat --colors --strict -vvv --no-interaction -f progress --rerun

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Behat logs - Sylius ${{ matrix.sylius }} - ${{ matrix.database }} - ${{ github.run_id }}"
                    path: etc/build/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true
